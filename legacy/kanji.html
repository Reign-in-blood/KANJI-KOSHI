<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Révision Kanji</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="main-container">
    <div id="menu"></div> <!-- menu -->
    <div class="menu-container">
      <div class="checkbox-container">
        <label>
          <input class="checkbox" type="checkbox" id="filter-n5" checked>
          N5
        </label>
        <label>
          <input class="checkbox" type="checkbox" id="filter-n4" unchecked>
          N4
        </label>
      </div>
      <div class="page-selector-container">
        <label for="page-selector">jusqu'à : </label>
        <select id="page-selector"></select>
      </div>
    </div>
    <div class="kanji-container">
      <div id="kanji-container-1" class="kanji-box">-</div>
      <div id="kanji-container-2" class="kanji-box">?</div>
      <div class="btn-container">
        <button class="btn" id="play-btn">► play</button>
        <button class="btn" id="skip-btn">Skip</button>
      </div>
    </div>
    <div class="lower-container">
      <div class="traduction-container">
        <div id="kanji-container-3" class="kanji-box">-</div>
        <div id="kanji-container-4" class="kanji-box">-</div>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="answear-container">
        <div id="kanji-container-5" class="kanji-box">-</div>
      </div>
    </div>
  </div>
  <div id="footer"></div> <!-- footer -->
  <script src="loader.js"></script>
  <script src="script_kanji.js"></script>
</body>

</html>
